services:
  g2b-alert:
    build: .
    container_name: g2b-alert
    restart: unless-stopped
    ports:
      - "3008:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - DB_PATH=/app/data/data.db
      - APP_PASSWORD=${APP_PASSWORD:-g2balert2026}
      - TZ=Asia/Seoul
