<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>나라장터 특정품목 알림</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#18181b">
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --background:#fff; --foreground:#18181b; --muted:#f4f4f5; --muted-foreground:#71717a;
  --border:#e4e4e7; --card:#fff; --primary:#18181b; --primary-foreground:#fafafa;
  --secondary:#fff; --secondary-foreground:#18181b; --destructive:#dc2626;
  --ring:#18181b; --radius:0.5rem;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .05); --shadow:0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
  --success:#16a34a; --success-bg:#f0fdf4; --success-border:#bbf7d0;
  --warn:#dc2626; --warn-bg:#fef2f2; --warn-border:#fecaca;
}
*{box-sizing:border-box;margin:0;font-family:'Inter','Malgun Gothic','맑은 고딕','Segoe UI',sans-serif}
body{background:var(--muted);color:var(--foreground);min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:18px;font-weight:700;color:var(--foreground);margin-bottom:2px}
.sub{font-size:12px;color:var(--muted-foreground);margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.card h2{font-size:14px;font-weight:600;color:var(--foreground);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
label{font-size:12px;color:var(--muted-foreground);display:block;margin-bottom:4px}
input,select{width:100%;background:var(--background);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);color:var(--foreground);padding:9px 12px;font-size:13px;outline:none;margin-bottom:8px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--ring);box-shadow:0 0 0 3px rgb(24 24 27 / .08)}
button{background:var(--primary);border:1px solid var(--primary);border-radius:calc(var(--radius) - 2px);color:var(--primary-foreground);padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.9}
button.secondary{background:var(--secondary);color:var(--secondary-foreground);border:1px solid var(--border)}
button.danger{background:var(--background);color:var(--destructive);border:1px solid var(--destructive)}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:var(--foreground);text-decoration:underline;text-underline-offset:2px;font-weight:500}
.row{display:flex;gap:8px}
.row>*{flex:1}
.pill{display:inline-block;background:var(--muted);border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:500;color:var(--muted-foreground)}
.pill.ok{color:var(--success);border-color:var(--success-border);background:var(--success-bg)}
.pill.warn{color:var(--warn);border-color:var(--warn-border);background:var(--warn-bg)}
.filter-item{border-top:1px solid var(--border);padding:8px 0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.filter-item:first-child{border-top:none}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.tabs button{flex:none;background:var(--background);color:var(--muted-foreground);border:1px solid var(--border);font-size:12px;padding:6px 14px;white-space:nowrap;border-radius:calc(var(--radius) - 2px);font-weight:500}
.tabs button.active{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:transparent;color:var(--muted-foreground);font-weight:500;padding:8px 6px;border:none;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left}
tbody td{padding:10px 6px;border:none;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
tbody tr:hover{background:var(--muted)}
td.num{text-align:right;color:var(--foreground);font-variant-numeric:tabular-nums}
td.center{text-align:center}
.table-scroll{overflow-x:auto}
pre{background:var(--muted);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:10px;font-size:11px;overflow:auto;max-height:260px;white-space:pre-wrap}
.err{color:var(--destructive);font-size:12px;margin:6px 0}
.msg{color:var(--success);font-size:12px;margin:6px 0}
#login-view{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--muted)}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);padding:36px 32px;width:340px;text-align:center;box-shadow:var(--shadow)}
.login-box .logo{font-size:34px;margin-bottom:6px}
#main-view{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-bottom:16px}
.topbar h1{margin-bottom:0}
.topbar-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (max-width:480px){
  .topbar h1{font-size:15px;flex-basis:100%}
  .topbar-actions{justify-content:flex-end;flex-basis:100%}
}
</style>
</head>
<body>

<div id="login-view">
  <div class="login-box">
    <div class="logo">🔔</div>
    <h1>나라장터 알림</h1>
    <p class="sub" id="auth-mode-sub">로그인하세요</p>
    <div class="err" id="login-err"></div>
    <input type="text" id="username" placeholder="아이디" autofocus autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('pw').focus()">
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitAuth()">
    <button style="width:100%" onclick="submitAuth()" id="auth-submit-btn">로그인</button>
    <p class="sub" style="margin-top:12px;margin-bottom:0">
      <a href="#" onclick="toggleAuthMode();return false" id="auth-toggle-link">계정이 없으신가요? 회원가입</a>
    </p>
  </div>
</div>

<div id="main-view">
  <div class="wrap">
    <div class="topbar">
      <h1>🔔 나라장터 특정품목 알림</h1>
      <div class="topbar-actions">
        <span class="sub" id="whoami" style="flex:none;margin-bottom:0"></span>
        <button class="secondary" style="flex:none" onclick="toggleNotifyPanel()">🔔 알림</button>
        <button class="secondary" style="flex:none" onclick="toggleSettings()">⚙️ 설정</button>
        <button class="secondary" style="flex:none" onclick="logout()">로그아웃</button>
      </div>
    </div>
    <div class="sub" id="last-run-sub">불러오는 중...</div>

    <div class="card" id="notify-panel" style="display:none">
      <h2>알림</h2>
      <button class="secondary" onclick="enablePush()" id="push-btn">홈화면 알림 켜기</button>
      <div class="sub" id="hub-sub" style="margin-top:8px">아직 실행한 적 없음</div>
      <div class="row" style="margin-top:6px">
        <input type="time" id="alarm-time">
        <button style="flex:none" onclick="saveAlarmTime()">저장</button>
      </div>
      <div class="err" id="alarm-time-err"></div>
      <div class="msg" id="alarm-time-msg"></div>
      <div class="sub" style="margin-top:6px">이 시간에 등록된 품목을 자동으로 조회하고, 신규 계약이 있으면 푸시로 알립니다.</div>
    </div>

    <div class="card" id="settings-panel" style="display:none">
      <h2>data.go.kr 서비스키 <span class="pill" id="key-pill">확인 중</span></h2>
      <label>공공데이터포털에서 발급받은 "조달청_물품목록정보서비스" 인증키(Decoding) — 품목 검색에 쓰입니다</label>
      <input type="password" id="service-key" placeholder="서비스키 입력">
      <button onclick="saveServiceKey()">저장</button>
      <div class="err" id="key-err"></div>

      <h2 style="margin-top:16px">비밀번호 변경</h2>
      <input type="password" id="current-password" placeholder="현재 비밀번호">
      <input type="password" id="new-password" placeholder="새 비밀번호">
      <input type="password" id="new-password-confirm" placeholder="새 비밀번호 확인">
      <button onclick="changePassword()">비밀번호 변경</button>
      <div class="err" id="password-err"></div>
      <div class="msg" id="password-msg"></div>
    </div>

    <div class="card">
      <h2>알림 받을 품목/지역</h2>
      <div class="row">
        <input id="item-search" style="flex:2" placeholder="품목 검색 (예: 제설제)" onkeydown="if(event.key==='Enter'){event.preventDefault();searchItems();}">
        <input id="filter-region" style="flex:1" placeholder="지역(선택)">
        <button class="secondary" style="flex:none" onclick="searchItems()">검색</button>
      </div>
      <div id="item-search-err" class="err"></div>
      <div id="item-search-results"></div>
      <div id="filter-list" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h2>특정품목 조달 내역 <span class="pill" id="hub-pill" style="display:none"></span></h2>
      <div class="tabs" id="contract-tabs"></div>
      <div class="row" style="align-items:flex-end;margin-bottom:8px">
        <div><label>시작일</label><input type="date" id="query-from"></div>
        <div><label>종료일</label><input type="date" id="query-to"></div>
        <button style="flex:none" onclick="runQuery()" id="query-btn">조회</button>
      </div>
      <div class="err" id="query-err"></div>
      <div id="hub-progress" style="display:none;margin-bottom:8px">
        <div class="sub" id="hub-progress-text"></div>
        <div style="background:#e5e8ec;border-radius:3px;height:8px;overflow:hidden;margin-top:4px">
          <div id="hub-progress-bar" style="background:#1c3f6e;height:100%;width:0%;transition:width .4s"></div>
        </div>
      </div>
      <div class="sub" id="hub-note" style="margin-bottom:8px;display:none"></div>
      <div class="table-scroll">
        <table>
          <thead><tr id="contract-thead"></tr></thead>
          <tbody id="contract-tbody"></tbody>
        </table>
      </div>
      <div class="sub" id="contract-empty" style="margin-top:8px">아직 없음</div>
      <div class="row" id="pager" style="margin-top:10px;justify-content:center;gap:8px;display:none">
        <button class="secondary" style="flex:none" onclick="gotoPage(currentPage-1)" id="pager-prev">이전</button>
        <span class="sub" id="pager-info" style="flex:none;align-self:center"></span>
        <button class="secondary" style="flex:none" onclick="gotoPage(currentPage+1)" id="pager-next">다음</button>
      </div>
    </div>
  </div>
</div>

<script>
async function api(path, opts) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

let authMode = 'login'; // 'login' | 'register'

function toggleAuthMode() {
  authMode = authMode === 'login' ? 'register' : 'login';
  document.getElementById('auth-mode-sub').textContent = authMode === 'login' ? '로그인하세요' : '새 계정을 만드세요';
  document.getElementById('auth-submit-btn').textContent = authMode === 'login' ? '로그인' : '회원가입';
  document.getElementById('auth-toggle-link').textContent = authMode === 'login' ? '계정이 없으신가요? 회원가입' : '이미 계정이 있으신가요? 로그인';
  document.getElementById('login-err').textContent = '';
}

async function submitAuth() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('pw').value;
  const err = document.getElementById('login-err');
  err.textContent = '';
  const endpoint = authMode === 'login' ? '/api/login' : '/api/register';
  try {
    await api(endpoint, { method: 'POST', body: JSON.stringify({ username, password }) });
    boot();
  } catch (e) { err.textContent = e.message; }
}

async function logout() {
  await api('/api/logout', { method: 'POST' }).catch(() => {});
  boot();
}

async function boot() {
  const { authed, username } = await api('/api/session');
  document.getElementById('login-view').style.display = authed ? 'none' : 'flex';
  document.getElementById('main-view').style.display = authed ? 'block' : 'none';
  if (authed) {
    document.getElementById('whoami').textContent = username ? `${username}님` : '';
    initQueryDates();
    await loadSettings(); await loadFilters(); await loadContracts();
  }
}

// 종료일을 오늘로 두면 허브 쪽 달력이 항상 하루 전으로 튕겨나가 조회가 실패하므로(집계가
// 아직 안 끝난 걸로 보임) 종료일 선택 상한을 어제로 막고, 기본값도 최근 30일로 채워준다.
function initQueryDates() {
  const toDate = (d) => d.toISOString().slice(0, 10);
  const yesterday = toDate(new Date(Date.now() - 86400000));
  const monthAgo = toDate(new Date(Date.now() - 30 * 86400000));
  const fromEl = document.getElementById('query-from'), toEl = document.getElementById('query-to');
  toEl.max = yesterday;
  fromEl.max = yesterday;
  fromEl.value = monthAgo;
  toEl.value = yesterday;
}

async function loadSettings() {
  const s = await api('/api/settings');
  const pill = document.getElementById('key-pill');
  pill.textContent = s.hasServiceKey ? '등록됨' : '미등록';
  pill.className = 'pill ' + (s.hasServiceKey ? 'ok' : 'warn');
  document.getElementById('last-run-sub').textContent = s.lastHubAt
    ? `마지막 조회: ${new Date(s.lastHubAt).toLocaleString('ko-KR')} · ${s.lastHubSummary || ''}`
    : `아직 조회 기록 없음 (매일 ${s.alarmTime} 자동 실행)`;
  if (s.lastHubAt) {
    document.getElementById('hub-sub').textContent = `마지막 조회: ${new Date(s.lastHubAt).toLocaleString('ko-KR')} · ${s.lastHubSummary || ''}`;
  }
  document.getElementById('alarm-time').value = s.alarmTime || '07:00';
  window.__vapidKey = s.vapidPublicKey;
}

function toggleSettings() {
  const el = document.getElementById('settings-panel');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function toggleNotifyPanel() {
  const el = document.getElementById('notify-panel');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function saveAlarmTime() {
  const time = document.getElementById('alarm-time').value;
  const err = document.getElementById('alarm-time-err'), msg = document.getElementById('alarm-time-msg');
  err.textContent = ''; msg.textContent = '';
  if (!time) { err.textContent = '시간을 선택하세요'; return; }
  try {
    await api('/api/settings/alarm-time', { method: 'POST', body: JSON.stringify({ time }) });
    msg.textContent = `저장됨 (매일 ${time}에 자동 조회)`;
    await loadSettings();
  } catch (e) { err.textContent = e.message; }
}

async function changePassword() {
  const currentPassword = document.getElementById('current-password').value;
  const newPassword = document.getElementById('new-password').value;
  const confirm = document.getElementById('new-password-confirm').value;
  const err = document.getElementById('password-err'), msg = document.getElementById('password-msg');
  err.textContent = ''; msg.textContent = '';
  if (!currentPassword || !newPassword) { err.textContent = '현재/새 비밀번호를 모두 입력하세요'; return; }
  if (newPassword !== confirm) { err.textContent = '새 비밀번호가 서로 다릅니다'; return; }
  try {
    await api('/api/settings/password', { method: 'POST', body: JSON.stringify({ currentPassword, newPassword }) });
    msg.textContent = '비밀번호가 변경되었습니다';
    document.getElementById('current-password').value = '';
    document.getElementById('new-password').value = '';
    document.getElementById('new-password-confirm').value = '';
  } catch (e) { err.textContent = e.message; }
}

// 진행 바는 hub-scrape든 hub-query든 어느 쪽이 돌든 공유한다(동시에 하나만 돌 수 있어서).
// %가 안 움직이면 멈춘 걸로 착각하기 쉬워서, 스크래퍼 내부 1~5단계 로그를 서버가 실시간으로
// 읽어 percent로 환산해준 걸 그대로 바 너비에 반영한다.
function updateHubProgress(st) {
  const box = document.getElementById('hub-progress');
  const text = document.getElementById('hub-progress-text');
  const bar = document.getElementById('hub-progress-bar');
  if (st.status === 'running') {
    box.style.display = 'block';
    text.textContent = `${st.progress || '진행 중...'} (${st.percent ?? 0}%)`;
    bar.style.width = `${st.percent ?? 0}%`;
  } else {
    box.style.display = 'none';
    bar.style.width = '0%';
  }
}

async function saveServiceKey() {
  const serviceKey = document.getElementById('service-key').value.trim();
  const err = document.getElementById('key-err');
  err.textContent = '';
  if (!serviceKey) return;
  try { await api('/api/settings/service-key', { method: 'POST', body: JSON.stringify({ serviceKey }) }); await loadSettings(); }
  catch (e) { err.textContent = e.message; }
}

// 검색 결과를 클릭하면 바로 그 자리에서 필터로 추가한다(예전엔 검색→클릭→키워드 입력칸에
// 채워짐→별도 "필터 추가" 버튼까지 3단계였다). 서비스키가 없거나 검색 결과가 없을 때를 대비해
// "검색 없이 그대로 추가" 버튼을 폴백으로 보여준다.
async function searchItems() {
  const keyword = document.getElementById('item-search').value.trim();
  const err = document.getElementById('item-search-err');
  const results = document.getElementById('item-search-results');
  err.textContent = ''; results.innerHTML = '';
  if (!keyword) return;
  results.innerHTML = '<div class="sub">검색 중...</div>';
  try {
    const data = await api(`/api/item-lookup?keyword=${encodeURIComponent(keyword)}`);
    results.innerHTML = '';
    for (const it of data.items) {
      const btn = document.createElement('button');
      btn.className = 'secondary';
      btn.style.cssText = 'display:block;width:100%;text-align:left;margin-bottom:4px';
      btn.textContent = (it.name || '(이름 없음)') + (it.code ? ` · ${it.code}` : '');
      if (it.desc) btn.title = it.desc;
      btn.onclick = () => addFilterFromSearch(it.name || keyword, it.code || null);
      results.appendChild(btn);
    }
    if (!data.items.length) addFallbackButton(keyword);
  } catch (e) {
    err.textContent = e.message;
    addFallbackButton(keyword);
  }
}

function addFallbackButton(keyword) {
  const results = document.getElementById('item-search-results');
  const btn = document.createElement('button');
  btn.className = 'secondary';
  btn.style.cssText = 'display:block;width:100%;text-align:left';
  btn.textContent = `"${keyword}" 검색 없이 그대로 추가`;
  btn.onclick = () => addFilterFromSearch(keyword, null);
  results.appendChild(btn);
}

async function addFilterFromSearch(keyword, itemCode) {
  const region = document.getElementById('filter-region').value.trim();
  const err = document.getElementById('item-search-err');
  err.textContent = '';
  try {
    await api('/api/filters', { method: 'POST', body: JSON.stringify({ keyword, region, itemCode }) });
    document.getElementById('item-search').value = '';
    document.getElementById('item-search-results').innerHTML = '';
    await loadFilters();
    renderContractTabs();
  } catch (e) { err.textContent = e.message; }
}

let allFilters = [];

async function loadFilters() {
  allFilters = await api('/api/filters');
  const list = document.getElementById('filter-list');
  list.innerHTML = allFilters.length ? '' : '<div class="sub">등록된 필터 없음</div>';
  for (const f of allFilters) {
    const div = document.createElement('div');
    div.className = 'filter-item';
    div.innerHTML = `<span>${f.keyword}${f.item_code ? ' (' + f.item_code + ')' : ''}${f.region ? ' · ' + f.region : ''}</span>`;
    const del = document.createElement('button');
    del.className = 'danger'; del.textContent = '삭제';
    del.onclick = async () => { await api(`/api/filters/${f.id}`, { method: 'DELETE' }); loadFilters(); loadContracts(); };
    div.appendChild(del);
    list.appendChild(div);
  }
}

let activeFilterId = 'all';
let tabCounts = { total: 0, byCode: {} }; // 탭 라벨용 품목별 전체 건수(기간 필터와 무관)
let currentPage = 1;
const PAGE_SIZE = 20;
let queryFrom = '', queryTo = ''; // "조회" 버튼으로 적용된 기간(YYYY-MM-DD). 비어있으면 기간 제한 없음.

const HUB_COLS = ['조달방식', '업무구분', '계약구분', '계약(납품요구)일자', '수요기관', '수요기관소재시군구',
  '세부품명번호', '세부품명', '품목명', '업체명', '낙찰방법', '단위', '계약납품단가', '계약납품수량', '공급금액'];

async function loadContracts() {
  await loadTabCounts();
  renderContractTabs();
  await loadTablePage();
}

async function loadTabCounts() {
  tabCounts = await api('/api/hub-items/counts').catch(() => ({ total: 0, byCode: {} }));
}

// 탭은 등록된 필터 전체를 기준으로 만든다(허브 수집을 아직 안 돌린 필터도 0건 탭으로 보이게).
function renderContractTabs() {
  const tabs = document.getElementById('contract-tabs');
  const validIds = new Set(allFilters.map((f) => f.id));
  if (!validIds.has(activeFilterId) && activeFilterId !== 'all') activeFilterId = 'all';
  tabs.innerHTML = '';
  const makeTab = (id, label) => {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.className = id === activeFilterId ? 'active' : '';
    btn.onclick = () => { activeFilterId = id; currentPage = 1; renderContractTabs(); loadTablePage(); };
    tabs.appendChild(btn);
  };
  makeTab('all', `전체 (${tabCounts.total})`);
  for (const f of allFilters) {
    const count = f.item_code ? (tabCounts.byCode[f.item_code] || 0) : 0;
    makeTab(f.id, `${f.keyword}${f.region ? ' · ' + f.region : ''} (${count})`);
  }
}

const cellHtml = (text, cls) =>
  `<td${cls ? ' class="' + cls + '"' : ''} title="${(text ?? '').toString().replace(/"/g, '&quot;')}">${text ?? ''}</td>`;
const isNumCol = (name) => /단가|수량|금액/.test(name);

function setHeader(cols) {
  document.getElementById('contract-thead').innerHTML = cols.map((c) => `<th>${c}</th>`).join('');
}

// 선택된 탭의 세부품명번호에 해당하는 허브 데이터가 있으면 그걸(단가·수량 포함) 우선 보여준다.
function activeItemCode() {
  if (activeFilterId === 'all') return null;
  const f = allFilters.find((x) => x.id === activeFilterId);
  return f ? f.item_code : null;
}

async function loadTablePage() {
  const code = activeItemCode();
  const params = new URLSearchParams({ page: currentPage, pageSize: PAGE_SIZE });
  if (code) params.set('code', code);
  if (queryFrom) params.set('from', queryFrom.replace(/-/g, ''));
  if (queryTo) params.set('to', queryTo.replace(/-/g, ''));
  const data = await api('/api/hub-items?' + params.toString()).catch(() => ({ rows: [], total: 0 }));
  renderTable(data);
}

function renderTable({ rows, total }) {
  const tbody = document.getElementById('contract-tbody');
  const empty = document.getElementById('contract-empty');
  const pill = document.getElementById('hub-pill');
  const note = document.getElementById('hub-note');
  const pager = document.getElementById('pager');
  tbody.innerHTML = '';

  setHeader(HUB_COLS);
  empty.style.display = rows.length ? 'none' : 'block';
  if (total) {
    pill.style.display = ''; pill.className = 'pill ok'; pill.textContent = '단가·수량 포함';
    note.style.display = ''; note.textContent = `조달데이터허브 자료 ${total}건`;
  } else {
    pill.style.display = 'none';
    note.style.display = 'none';
  }
  for (const h of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = HUB_COLS.map((c) => cellHtml(h[c], isNumCol(c) ? 'num' : (c === '조달방식' || c === '업무구분' ? 'center' : ''))).join('');
    tbody.appendChild(tr);
  }

  const pageCount = Math.max(1, Math.ceil(total / PAGE_SIZE));
  pager.style.display = total > PAGE_SIZE ? 'flex' : 'none';
  document.getElementById('pager-info').textContent = `${currentPage} / ${pageCount} 페이지`;
  document.getElementById('pager-prev').disabled = currentPage <= 1;
  document.getElementById('pager-next').disabled = currentPage >= pageCount;
}

function gotoPage(p) {
  if (p < 1) return;
  currentPage = p;
  loadTablePage();
}

// "조회" 버튼: 선택한 기간이 이미 다 긁어져 있으면 바로 DB에서 보여주고, 빠진 구간만 있을 때만
// 서버가 그 구간만 골라 허브에서 긁는다(알림은 안 감 — 그냥 조회용).
async function runQuery() {
  const fromEl = document.getElementById('query-from'), toEl = document.getElementById('query-to');
  const err = document.getElementById('query-err');
  const btn = document.getElementById('query-btn');
  err.textContent = '';
  const from = fromEl.value, to = toEl.value;
  if (!from || !to) { err.textContent = '시작일과 종료일을 모두 선택하세요'; return; }
  if (from > to) { err.textContent = '시작일이 종료일보다 늦습니다'; return; }
  queryFrom = from; queryTo = to; currentPage = 1;

  const code = activeItemCode();
  btn.disabled = true; btn.textContent = '확인 중...';
  try {
    const result = await api('/api/hub-query', {
      method: 'POST',
      body: JSON.stringify({ itemCode: code, fromDate: from.replace(/-/g, ''), toDate: to.replace(/-/g, '') }),
    });
    if (!result.needsScrape) {
      btn.disabled = false; btn.textContent = '조회';
      await loadTablePage();
      return;
    }
    btn.textContent = '조회 중...';
    const poll = setInterval(async () => {
      const st = await api('/api/hub-scrape/status');
      updateHubProgress(st);
      if (st.status === 'done' || st.status === 'error') {
        clearInterval(poll);
        btn.disabled = false; btn.textContent = '조회';
        if (st.error) err.textContent = st.error;
        await loadTabCounts(); renderContractTabs();
        await loadTablePage();
      }
    }, 2000);
  } catch (e) {
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = '조회';
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function enablePush() {
  const btn = document.getElementById('push-btn');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('이 브라우저는 푸시 알림을 지원하지 않습니다. 홈 화면에 추가한 뒤 다시 시도해 보세요.');
    return;
  }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return alert('알림 권한이 거부되었습니다.');
    const reg = await navigator.serviceWorker.register('/sw.js');
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(window.__vapidKey),
    });
    await api('/api/push/subscribe', { method: 'POST', body: JSON.stringify(sub) });
    btn.textContent = '알림 켜짐 ✔';
    btn.disabled = true;
  } catch (e) { alert('알림 등록 실패: ' + e.message); }
}

boot();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
